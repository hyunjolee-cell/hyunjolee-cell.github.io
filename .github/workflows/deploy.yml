name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run build

      - name: Ensure manuals are bundled into dist
        run: |
          mkdir -p dist/manuals
          cp -rv public/manuals/. dist/manuals/
          ls -lh dist/manuals

      - name: Bundle source code (template)
        run: |
          mkdir -p source-bundle
          rsync -a \
            --exclude='node_modules' \
            --exclude='dist' \
            --exclude='.git' \
            --exclude='source-bundle' \
            --exclude='public/manuals' \
            ./ source-bundle/baekdabang-rollout-v3/
          mkdir -p dist/downloads
          (cd source-bundle && zip -rq ../dist/downloads/source-code.zip baekdabang-rollout-v3)
          rm -rf source-bundle
          echo "--- source-code.zip ---"
          ls -lh dist/downloads/source-code.zip

      - name: Bundle HTML package
        run: |
          mkdir -p html-bundle/baekdabang-html
          rsync -a --exclude='manuals' --exclude='downloads' dist/ html-bundle/baekdabang-html/
          (cd html-bundle && zip -rq ../dist/downloads/site-html.zip baekdabang-html)
          rm -rf html-bundle
          echo "--- site-html.zip ---"
          ls -lh dist/downloads/site-html.zip

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
