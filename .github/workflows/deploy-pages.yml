name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build Pages artifact
        run: |
          rm -rf _site
          mkdir -p _site
          rsync -a \
            --exclude='.git' \
            --exclude='.github' \
            --exclude='_site' \
            ./ _site/
          touch _site/.nojekyll
          test -f _site/index.html
          test -f _site/couple-finance/index.html
          test -f _site/couple-finance/app-v2.js
          test -f _site/couple-finance/app-v2.css
          test -f _site/couple-finance/auth-bridge.js
          test -f _site/couple-finance/anonymous-access.js
          echo 'Couple finance deployment files:'
          find _site/couple-finance -maxdepth 2 -type f -print | sort

      - name: Validate couple finance JavaScript
        run: |
          node --check _site/couple-finance/app-v2.js
          node --check _site/couple-finance/auth-bridge.js
          node --check _site/couple-finance/anonymous-access.js

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4
