<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>부부 자산관리 DB 설정</title>
  <style>
    body{margin:0;background:#f4f6fb;color:#172033;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
    main{max-width:720px;margin:0 auto;padding:24px 18px 48px}
    .card{background:#fff;border:1px solid #e5eaf2;border-radius:22px;padding:20px;box-shadow:0 12px 34px rgba(25,39,73,.08)}
    h1{font-size:24px;margin:0 0 10px}p{line-height:1.55;color:#667085}
    textarea{width:100%;height:52vh;box-sizing:border-box;border:1px solid #d9dfeb;border-radius:14px;padding:14px;font:12px/1.5 monospace;background:#fafbfe}
    .row{display:grid;gap:10px;margin-top:14px}.btn{display:block;text-align:center;text-decoration:none;border:0;border-radius:14px;padding:14px;font-weight:800;font-size:16px}.primary{background:#315efb;color:#fff}.secondary{background:#eef2ff;color:#315efb}.status{font-size:13px;color:#0a8f63;margin-top:10px;min-height:20px}
  </style>
</head>
<body>
<main><div class="card">
  <h1>Supabase DB 스키마 설정</h1>
  <p>아래 SQL을 전체 복사한 뒤 Supabase SQL Editor에 붙여넣고 <b>Run</b>을 누르세요.</p>
  <textarea id="sql" readonly>불러오는 중...</textarea>
  <div class="row">
    <button id="copy" class="btn primary">SQL 전체 복사</button>
    <a class="btn secondary" href="https://supabase.com/dashboard/project/ysoyvoytluacdgivuffl/sql/new" target="_blank" rel="noopener">Supabase SQL Editor 열기</a>
  </div>
  <div id="status" class="status"></div>
</div></main>
<script>
(async()=>{
  const box=document.querySelector('#sql');
  const status=document.querySelector('#status');
  try{
    const response=await fetch('./schema.sql?ts=20260719',{cache:'no-store'});
    if(!response.ok) throw new Error('SQL 파일을 불러오지 못했습니다.');
    box.value=await response.text();
  }catch(error){box.value='';status.textContent=error.message;}
  document.querySelector('#copy').addEventListener('click',async()=>{
    try{await navigator.clipboard.writeText(box.value);status.textContent='복사 완료. 이제 SQL Editor에 붙여넣고 Run을 누르세요.';}
    catch{box.focus();box.select();document.execCommand('copy');status.textContent='복사 완료. 이제 SQL Editor에 붙여넣고 Run을 누르세요.';}
  });
})();
</script>
</body>
</html>
